name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          pip install --upgrade nbconvert
          pip install -r requirements.txt
          npm ci

      - name: Update citations for this build
        shell: bash
        run: |
          set +e
          timeout 90 python bin/update_scholar_citations.py
          status=$?
          if [ $status -eq 0 ]; then
            echo "Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "Citation update failed with exit code $status; deploying with the checked-in citation data." >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Update _config.yml
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Build site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Deploy site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
